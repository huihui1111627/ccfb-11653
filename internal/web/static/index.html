<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作窃取调度器 · 实时面板</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --busy: #3fb950; --steal: #d29922; --idle: #30363d;
    --accent: #58a6ff; --danger: #f85149; --done: #238636; --running:#1f6feb;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin:0; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, select { background:#21262d; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--running); border-color:var(--running); }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; padding:14px 20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .col-4 { grid-column:span 4; } .col-6{grid-column:span 6;} .col-8{grid-column:span 8;} .col-12{grid-column:span 12;}
  @media (max-width:1100px){ .col-4,.col-6,.col-8{grid-column:span 12;} }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:right; padding:5px 6px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; }
  .state-busy{color:var(--busy);} .state-stealing{color:var(--steal);} .state-idle{color:var(--muted);}
  .bar { height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--idle); min-width:90px; }
  .bar .b-busy{background:var(--busy);} .bar .b-steal{background:var(--steal);}
  .qbar { height:8px; background:var(--idle); border-radius:4px; position:relative; min-width:120px; }
  .qbar > div { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:4px; }
  .log { max-height:280px; overflow:auto; font-size:12px; }
  .log table td,.log table th{ padding:3px 6px; }
  .tree { max-height:380px; overflow:auto; }
  .tnode { padding:2px 0 2px 4px; border-left:1px dotted var(--border); margin-left:10px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; margin-right:6px; }
  .b-ready{background:#30363d;color:var(--muted);} .b-running{background:var(--running);}
  .b-done{background:var(--done);} .b-stolen{background:#8957e5;}
  .muted{color:var(--muted);} .ok{color:var(--busy);} .bad{color:var(--danger);}
  .chart { width:100%; height:260px; }
  .legend { display:flex; gap:14px; margin-top:6px; color:var(--muted); font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .runinfo { font-size:12px; color:var(--muted); }
  .runinfo b{color:var(--text);}
  svg text { fill: var(--muted); font-size:11px; }
  .axis { stroke: var(--border); stroke-width:1; }
</style>
</head>
<body>
<header>
  <h1>⚙️ 工作窃取任务并行运行时</h1>
  <div class="controls">
    <label class="muted">负载
      <select id="workload">
        <option value="go">围棋局面搜索</option>
        <option value="merge">并行归并排序</option>
        <option value="matmul" selected>矩阵乘</option>
      </select>
    </label>
    <button class="primary" id="runBtn">运行负载</button>
    <label class="muted">窃取策略
      <select id="stealMode">
        <option value="half">一次偷一半</option>
        <option value="one">一次偷一个</option>
      </select>
    </label>
    <button id="speedupBtn">测量加速比 (1..N)</button>
  </div>
  <span class="runinfo" id="runInfo"></span>
</header>

<div class="grid">
  <section class="card col-8">
    <h2>工作线程 · 队列长度 · 忙碌/窃取/空闲占比</h2>
    <table id="workerTable">
      <thead><tr>
        <th>线程</th><th>状态</th><th>本队队列</th><th>时间占比</th>
        <th>执行任务</th><th>偷来任务</th><th>被偷次数</th><th>自旋</th><th>停车</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="legend">
      <span><i style="background:var(--busy)"></i>忙碌 busy</span>
      <span><i style="background:var(--steal)"></i>窃取中 stealing</span>
      <span><i style="background:var(--idle)"></i>空闲 idle</span>
    </div>
  </section>

  <section class="card col-4">
    <h2>队列长度（实时）</h2>
    <div id="queues"></div>
  </section>

  <section class="card col-6">
    <h2>窃取记录</h2>
    <div class="log"><table>
      <thead><tr><th>#</th><th>受害线程</th><th>小偷线程</th><th>数量</th><th>任务ID</th></tr></thead>
      <tbody id="stealLog"></tbody>
    </table></div>
  </section>

  <section class="card col-6">
    <h2>加速比</h2>
    <svg class="chart" id="speedupChart" viewBox="0 0 560 260" preserveAspectRatio="none"></svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>实测加速比</span>
      <span><i style="background:var(--muted)"></i>理想线性加速</span>
    </div>
  </section>

  <section class="card col-12">
    <h2>任务树 <span class="muted" id="treeMeta"></span></h2>
    <div class="tree" id="taskTree"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (x, d=1) => x.toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
const stateCls = (s) => ({0:'state-idle',1:'state-busy',2:'state-stealing'})[s] || 'state-idle';
const stateName = (s) => ({0:'空闲',1:'忙碌',2:'窃取中'})[s] || '?';

async function poll() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    renderWorkers(data);
    renderQueues(data);
    renderSteals(data);
    renderTree(data);
    renderRunInfo(data);
  } catch (e) { /* transient: keep polling */ }
}

function renderWorkers(data) {
  const tb = $('workerTable').querySelector('tbody');
  const rows = data.workers.map(w => {
    const share = data.timeShare.find(t => t.id === w.id) || {busy:0,steal:0,idle:1};
    const busyPct = share.busy*100, stealPct=share.steal*100, idlePct=share.idle*100;
    return `<tr>
      <td>W${w.id}</td>
      <td class="${stateCls(w.state)}">${stateName(w.state)}</td>
      <td>${w.queueLen}</td>
      <td><div class="bar" title="忙${fmt(busyPct)}% 偷${fmt(stealPct)}% 闲${fmt(idlePct)}%">
        <div class="b-busy" style="width:${busyPct}%"></div>
        <div class="b-steal" style="width:${stealPct}%"></div>
      </div></td>
      <td>${w.tasksExecuted}</td>
      <td>${w.tasksStolen}</td>
      <td>${w.timesStolen}</td>
      <td>${w.spins}</td>
      <td>${w.parks}</td>
    </tr>`;
  }).join('');
  tb.innerHTML = rows;
}

function renderQueues(data) {
  const max = Math.max(1, ...data.workers.map(w => w.queueLen));
  $('queues').innerHTML = data.workers.map(w => {
    const pct = (w.queueLen / max) * 100;
    return `<div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <span style="width:32px" class="muted">W${w.id}</span>
      <div class="qbar"><div style="width:${pct}%"></div></div>
      <span style="width:42px;text-align:right">${w.queueLen}</span>
    </div>`;
  }).join('');
}

function renderSteals(data) {
  const ev = [...data.monitor.steals].reverse();
  $('stealLog').innerHTML = ev.map(e =>
    `<tr><td>${e.seq}</td><td>W${e.victim}</td><td>W${e.thief}</td><td>${e.count}</td><td>#${e.taskId}</td></tr>`
  ).join('') || '<tr><td colspan="5" class="muted">尚无窃取记录</td></tr>';
}

function renderTree(data) {
  const tasks = data.monitor.tasks;
  if (!tasks.length) { $('taskTree').innerHTML = '<span class="muted">运行负载后显示任务树</span>'; $('treeMeta').textContent=''; return; }
  const byId = new Map(tasks.map(t => [t.id, t]));
  const roots = tasks.filter(t => t.parentId < 0 || !byId.has(t.parentId));
  $('treeMeta').textContent = `共 ${tasks.length} 个节点（上限外已剪枝 ${data.monitor.prunedTasks} 个）`;
  const badge = (t) => {
    const cls = t.state === 'done' ? 'b-done' : t.state === 'running' ? 'b-running' : 'b-ready';
    const who = t.stolen ? `<span class="badge b-stolen">被偷 →W${t.worker}</span>` :
      (t.worker >= 0 ? `<span class="muted">W${t.worker}</span>` : '');
    return `<span class="badge ${cls}">${t.state}</span>${t.name || 'task'} #${t.id} ${who}`;
  };
  const walk = (t, depth) => {
    if (depth > 60) return ''; // guard for very deep trees
    let html = `<div class="tnode" style="margin-left:${depth*14}px">${badge(t)}</div>`;
    for (const cid of (t.childIds || [])) {
      const c = byId.get(cid);
      if (c) html += walk(c, depth+1);
    }
    return html;
  };
  $('taskTree').innerHTML = roots.map(r => walk(r, 0)).join('');
}

function renderRunInfo(data) {
  const r = data.lastRun;
  if (!r) { $('runInfo').textContent = ''; return; }
  const verdict = r.correct ? '<span class="ok">✓ 与单线程结果一致</span>' : '<span class="bad">✗ 结果不一致</span>';
  $('runInfo').innerHTML = `最近运行: <b>${r.workload}</b> · ${fmt(r.elapsedMs,2)}ms · ${r.workers}线程 · ${r.stealMode} · ${verdict}${r.error ? ' · 错误:'+r.error : ''}`;
}

// --- speedup chart (hand-rolled SVG, no external libraries) ---
function renderSpeedup(serialMs, results) {
  const svg = $('speedupChart');
  const W=560, H=260, padL=44, padR=16, padT=16, padB=34;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxN = Math.max(...results.map(r=>r.workers), 1);
  const maxY = Math.max(maxN, ...results.map(r=>r.speedup), 1);
  const x = (n) => padL + (n/maxN)*iw;
  const y = (v) => padT + ih - (v/maxY)*ih;
  const grid = [0,0.25,0.5,0.75,1].map(f=>{
    const val = maxY*f, yy=y(val);
    return `<line class="axis" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/>
            <text x="${padL-6}" y="${yy+4}" text-anchor="end">${fmt(val,1)}x</text>`;
  }).join('');
  const xticks = results.map(r=>`<text x="${x(r.workers)}" y="${H-10}" text-anchor="middle">${r.workers}</text>`).join('');
  const ideal = `<polyline fill="none" stroke="var(--muted)" stroke-dasharray="5 4"
      points="${x(1)},${y(1)} ${x(maxN)},${y(maxN)}"/>`;
  const pts = results.map(r=>`${x(r.workers)},${y(r.speedup)}`).join(' ');
  const measured = `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/>` +
    results.map(r=>`<circle cx="${x(r.workers)}" cy="${y(r.speedup)}" r="4" fill="${r.correct?'var(--accent)':'var(--danger)'}">
      <title>W${r.workers}: ${fmt(r.speedup,2)}x, 效率${fmt(r.efficiency*100,1)}%</title></circle>`).join('');
  svg.innerHTML = grid + xticks + ideal + measured +
    `<text x="${W/2}" y="${H-0}" text-anchor="middle">工作线程数</text>`;
}

$('runBtn').onclick = async () => {
  await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({workload: $('workload').value})});
};
$('stealMode').onchange = async (e) => {
  await fetch('/api/steal-mode', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({mode: e.target.value})});
};
$('speedupBtn').onclick = async () => {
  const res = await fetch('/api/speedup?workload=' + $('workload').value);
  const data = await res.json();
  renderSpeedup(data.serialMs, data.results);
};

poll();
setInterval(poll, 500);
</script>
</body>
</html>
